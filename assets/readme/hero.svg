<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Browser Extension Skills</title>
  <desc id="desc">Agent skills for building, real-browser testing, and debugging Chrome MV3 extensions. A three-stage pipeline: develop, test, debug.</desc>

  <defs>
    <style>
      .bg   { fill: #0b0d10; }
      .ink  { fill: #f2f3f5; }
      .mut  { fill: #8b929c; }
      .acc  { fill: #4f8cff; }
      .line { stroke: #2a2f37; stroke-width: 1; }
      .box  { fill: #15191f; stroke: #2a2f37; stroke-width: 1; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="380" rx="22" class="bg"/>

  <!-- LEFT: title block -->
  <g transform="translate(56 64)">
    <text x="0" y="0" class="mono mut" font-size="18" letter-spacing="3">AGENT SKILLS · CHROME EXTENSIONS</text>
    <text x="0" y="56" class="sans ink" font-size="62" font-weight="700">Browser Extension</text>
    <text x="0" y="124" class="sans ink" font-size="62" font-weight="700">Skills</text>
    <text x="0" y="170" class="sans mut" font-size="22">Build, real-browser test, and debug</text>
    <text x="0" y="200" class="sans mut" font-size="22">Chrome MV3 extensions — end to end.</text>

    <!-- proof chips -->
    <g transform="translate(0 236)">
      <rect x="0" y="0" width="220" height="46" rx="10" class="box"/>
      <text x="16" y="30" class="mono acc" font-size="20" font-weight="700">23/23</text>
      <text x="78" y="30" class="mono mut" font-size="14">E2E checks</text>
      <rect x="236" y="0" width="200" height="46" rx="10" class="box"/>
      <text x="252" y="30" class="mono ink" font-size="14">MV3 · CDP · Python</text>
    </g>
  </g>

  <!-- RIGHT: three-stage pipeline -->
  <g transform="translate(620 70)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="160" height="180" rx="14" class="box"/>
      <text x="16" y="34" class="mono acc" font-size="14" font-weight="700">01</text>
      <text x="16" y="64" class="sans ink" font-size="20" font-weight="600">Develop</text>
      <line x1="16" y1="78" x2="144" y2="78" class="line"/>
      <text x="16" y="104" class="mono mut" font-size="13">manifest.json</text>
      <text x="16" y="126" class="mono mut" font-size="13">service worker</text>
      <text x="16" y="148" class="mono mut" font-size="13">content script</text>
    </g>
    <path d="M164 90 l20 0 m-6 -6 l6 6 l-6 6" stroke="#4f8cff" stroke-width="2" fill="none"/>

    <g transform="translate(188 0)">
      <rect x="0" y="0" width="160" height="180" rx="14" class="box"/>
      <text x="16" y="34" class="mono acc" font-size="14" font-weight="700">02</text>
      <text x="16" y="64" class="sans ink" font-size="20" font-weight="600">Test</text>
      <line x1="16" y1="78" x2="144" y2="78" class="line"/>
      <text x="16" y="104" class="mono mut" font-size="13">CfT binary</text>
      <text x="16" y="126" class="mono mut" font-size="13">--load-ext</text>
      <text x="16" y="148" class="mono mut" font-size="13">CDP assert</text>
    </g>
    <path d="M352 90 l20 0 m-6 -6 l6 6 l-6 6" stroke="#4f8cff" stroke-width="2" fill="none"/>

    <g transform="translate(376 0)">
      <rect x="0" y="0" width="160" height="180" rx="14" class="box"/>
      <text x="16" y="34" class="mono acc" font-size="14" font-weight="700">03</text>
      <text x="16" y="64" class="sans ink" font-size="20" font-weight="600">Debug</text>
      <line x1="16" y1="78" x2="144" y2="78" class="line"/>
      <text x="16" y="104" class="mono mut" font-size="13">a11y · cookie</text>
      <text x="16" y="126" class="mono mut" font-size="13">LCP · memory</text>
      <text x="16" y="148" class="mono mut" font-size="13">troubleshoot</text>
    </g>

    <!-- CDP console motif -->
    <g transform="translate(0 214)">
      <circle cx="8" cy="0" r="5" fill="#3fb950"/>
      <circle cx="26" cy="0" r="5" fill="#3fb950"/>
      <circle cx="44" cy="0" r="5" fill="#3fb950"/>
      <text x="64" y="5" class="mono mut" font-size="14">runtime.consoleAPICalled</text>
    </g>
  </g>

  <line x1="56" y1="356" x2="1144" y2="356" class="line"/>
  <text x="1144" y="348" text-anchor="end" class="mono mut" font-size="13">Apache-2.0 + MIT</text>
</svg>
